<!DOCTYPE html>
<html>
<head>
  <title>Samir veux-tu être ma loutre ? 🦦</title>

  <style>
    body {
      text-align: center;
      background-color: #ffe6f0;
      font-family: Arial, sans-serif;
      margin-top: 100px;
      overflow: hidden;
    }

    h1 {
      font-size: 40px;
      transition: 0.3s;
    }

    button {
      padding: 10px 20px;
      font-size: 20px;
      margin: 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
    }

    #no {
      background-color: #999;
      color: white;
    }

    .heart {
      position: fixed;
      top: -10px;
      font-size: 20px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <h1 id="question">Samir, veux-tu être ma loutre ? 🦦</h1>

  <button id="yes">Oui ❤️</button>
  <button id="no">Non</button>

  <!-- Musique romantique -->
  <audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const question = document.getElementById("question");
    const music = document.getElementById("music");

    let yesSize = 20;
    let clickCount = 0;

    const messages = [
      "T’es sûr ? 😳",
      "Vraiment sûr ??",
      "Réfléchis bien 😏",
      "Tu vas regretter 👀",
      "Dernière chance 😈",
      "Dis oui pétard ! 😭❤️"
    ];

    noBtn.addEventListener("click", function() {
      clickCount++;

      yesSize += 15;
      yesBtn.style.fontSize = yesSize + "px";
      yesBtn.style.padding = (yesSize / 2) + "px";

      if (clickCount <= messages.length) {
        question.textContent = messages[clickCount - 1];
      } else {
        question.textContent = "Bon… tu n’as plus le choix 😌❤️";
        noBtn.style.display = "none";
      }
    });

    yesBtn.addEventListener("click", function() {

      // Lancer musique
      music.play();

      // Changer écran
      document.body.innerHTML = `
        <h1 style="margin-top:150px; font-size:50px;">
          JE SAVAIS QUE TU ALLAIS DIRE OUI 😍❤️
        </h1>
      `;

      // Pluie de cœurs
      setInterval(createHeart, 200);
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
      heart.style.fontSize = (Math.random() * 30 + 20) + "px";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }
  </script>

</body>
</html>
